# G1 candidate C (native iOS: Swift + SwiftUI) - NON-PRODUCTION / SYNTHETIC DATA ONLY.
# XcodeGen 2.46.0 project definition; the generated .xcodeproj is not tracked. The end-to-end UI flow is the shared
# runner in ios-ci/e2e (the same XCUITest flow drives candidates A, B and C by bundle identifier).
name: G1CandidateC
options:
  bundleIdPrefix: com.example.g1bench
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # MapLibre Native iOS 6.28.0: the version candidates A and B use (parity)
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.28.0
  # G1 common native module (shared with candidates A and B); candidate C calls it directly
  G1NativeCommon:
    path: ../../native-common/ios
targets:
  G1CandidateC:
    type: application
    platform: iOS
    sources:
      - path: G1CandidateC
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: G1NativeCommon
        product: G1NativeCommon
    info:
      path: G1CandidateC/Info.plist
      properties:
        CFBundleDisplayName: "G1 Candidate C"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        NSCameraUsageDescription: "Scans synthetic anchor codes and shows AR guidance in this non-production lab build."
        CFBundleURLTypes:
          - CFBundleURLName: com.example.g1bench.candidatec.lab
            CFBundleURLSchemes: [g1bench-c]
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.g1bench.candidatec
        TARGETED_DEVICE_FAMILY: "1,2"
  G1CandidateCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: G1CandidateCTests
    dependencies:
      - target: G1CandidateC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.g1bench.candidatec.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  G1CandidateC:
    build:
      targets:
        G1CandidateC: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - G1CandidateCTests
