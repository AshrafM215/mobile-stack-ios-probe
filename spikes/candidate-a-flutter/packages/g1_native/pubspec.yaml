name: g1_native
description: "Adapter from candidate A (Flutter) to the G1 common native module - NON-PRODUCTION / SYNTHETIC DATA ONLY."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.g1bench.g1native
        pluginClass: G1NativePlugin
      ios:
        pluginClass: G1NativePlugin
